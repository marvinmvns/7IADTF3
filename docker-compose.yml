services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medassist
      POSTGRES_USER: medassist
      POSTGRES_PASSWORD: medassist123
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medassist"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ====== LLM: llama.cpp (Intel Arc GPU via SYCL) ======
  # Servidor único — o modelo ativo é controlado via symlink /models/active-model.gguf
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-intel
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models
    environment:
      ZES_ENABLE_SYSMAN: "1"
      SYCL_CACHE_PERSISTENT: "1"
      TZ: America/Sao_Paulo
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"
    command: >
      --host 0.0.0.0
      --port 8080
      --model /models/active-model.gguf
      --n-gpu-layers 99
      --ctx-size 8192
      --threads 4
      --jinja
      --reasoning-budget 0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: medassist
      DB_USER: medassist
      DB_PASS: medassist123
      LLM_PROVIDER: llama-cpp
      LLAMA_CPP_URL: http://llama-server:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_HOME: /opt/hf_cache
      MODELS_DIR: /models
      ZES_ENABLE_SYSMAN: "1"
      ONEAPI_DEVICE_SELECTOR: "level_zero:0"
      TZ: America/Sao_Paulo
    volumes:
      - hf_cache:/opt/hf_cache
      - finetuned_models:/app/models/finetuned
      - ./models:/models
      - /var/run/docker.sock:/var/run/docker.sock
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8090:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  hf_cache:
  finetuned_models:
